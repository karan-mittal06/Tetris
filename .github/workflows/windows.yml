name: Build Windows EXE

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-raylib

      - name: Build
        shell: msys2 {0}
        run: |
          g++ -std=c++17 -O2 \
          main.cpp game.cpp grid.cpp block.cpp blocks.cpp colors.cpp position.cpp network_manager.cpp \
          -o tetris.exe \
          $(pkg-config --cflags --libs raylib) \
          -lws2_32

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: tetris-windows
          path: tetris.exe